<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDD - SM - 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>💬 SDD - SM - 2026</h1>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <p>Deja tu comentario para el curso</p>
  </header>

  <main>
    <section id="form-section">
      <form id="comment-form">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" maxlength="60" required placeholder="Tu nombre">

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" maxlength="500" required placeholder="Escribe tu mensaje..."></textarea>

        <div class="rating-group">
          <label>Valoración</label>
          <div class="star-rating">
            <input type="radio" id="star5" name="rating" value="5" required>
            <label for="star5" title="5 estrellas">★</label>
            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4" title="4 estrellas">★</label>
            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3" title="3 estrellas">★</label>
            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2" title="2 estrellas">★</label>
            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1" title="1 estrella">★</label>
          </div>
        </div>

        <button type="submit" id="submit-btn">Comentar</button>
      </form>
    </section>

    <section id="feed-section">
      <h2>Comentarios</h2>
      <div id="comments-feed">
        <p class="loading">Cargando comentarios...</p>
      </div>
    </section>
  </main>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
